[project]
name = "comfyui-sharp-portrait"
version = "0.1.2"
description = "Interactive single-photo portrait novel-view synthesis with SHARP Gaussian splats, Qwen Image 2.1 Turbo repair, reference detail refinement and camera trajectory export."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["numpy", "Pillow", "scipy"]
classifiers = ["Operating System :: Microsoft :: Windows", "Environment :: GPU :: NVIDIA CUDA", "Programming Language :: Python :: 3"]
[project.urls]
Repository = "https://github.com/lueluelue12138/ComfyUI-SHARP-Portrait"
Issues = "https://github.com/lueluelue12138/ComfyUI-SHARP-Portrait/issues"
